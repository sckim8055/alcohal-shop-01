spring.application.name=sool-server-test
# 테스트는 자료를 모두 지우고 다시 넣으므로 개발용 DB(sool)와 다른 DB(sool_test)를 쓴다.
spring.datasource.url=${SOOL_TEST_DB_URL:jdbc:postgresql://localhost:5433/sool_test}
spring.datasource.username=${SOOL_DB_USER:sool}
spring.datasource.password=${SOOL_DB_PASSWORD:}
spring.flyway.enabled=true
sool.sample-data=false
sool.tracking.mock-step-seconds=30
sool.sweep-interval-ms=3600000
sool.upload-dir=./build/test-uploads
