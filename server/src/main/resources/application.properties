spring.application.name=sool-server
server.port=8080

# 로컬: 파일 DB (server/data 폴더). 운영에서는 MySQL 설정으로 교체한다.
spring.datasource.url=jdbc:h2:file:./data/sool;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=

spring.flyway.enabled=true
spring.threads.virtual.enabled=true

# 세션 쿠키: 스크립트에서 읽을 수 없고, 다른 사이트에서 보낸 요청에는 붙지 않는다.
# 운영(HTTPS)에서는 server.servlet.session.cookie.secure=true 로 바꾼다.
server.servlet.session.cookie.name=sool.sid
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=2h

# 시범 데이터: DB가 비어 있을 때만 넣는다. 운영에서는 반드시 false.
sool.sample-data=true
# 가짜 배송 조회: 발송 후 이 시간(초)마다 한 단계씩 진행되어 5단계째에 배송 완료가 된다.
sool.tracking.mock-step-seconds=30

# 로그인 세션을 디스크에 남겨, 서버를 껐다 켜도 로그인이 유지되게 한다.
server.servlet.session.persistent=true
server.servlet.session.store-dir=./data/sessions

# 올린 사진·동영상을 두는 곳과 크기 제한(동영상 100MB)
sool.upload-dir=./data/uploads
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=105MB
